# Mainline: SmolLM2-360M arch, FineWeb-Edu ~7B tokens, dual seed via --seed + isolate
seed: 42
isolate_seed_paths: true

arch_model_id: HuggingFaceTB/SmolLM2-360M
tokenizer_id: HuggingFaceTB/SmolLM2-360M

data:
  train_dataset: HuggingFaceFW/fineweb-edu
  train_dataset_config: sample-10BT
  text_column: text
  eval_dataset: Salesforce/wikitext
  eval_dataset_config: wikitext-2-raw-v1
  seq_len: 512
  prefetch_fineweb: true
  stream_shuffle_buffer: 10000
  tokenize_flush_docs: 256

train:
  target_tokens: 7000000000  # ~7B ≈ 20 tok/param
  max_steps: 500000
  # GB200 ~189GB/GPU: large micro-batch, minimal accum → higher GPU occupancy
  batch_size: 64
  grad_accum: 1
  lr: 3.0e-4
  min_lr: 3.0e-5
  warmup_steps: 2000
  weight_decay: 0.1
  max_grad_norm: 1.0
  log_every: 50
  save_every: 500            # denser NFS checkpoints (machine may reclaim often)
  resume: true
  bf16: true
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  allow_tf32: true
  cudnn_benchmark: true
  compile_mxfp4: true        # torch.compile Mxfp4Linear (FQ only; no-op for BF16)

eval:
  stride: 256
  max_eval_tokens: null
  val_tokens: 1000000
  val_every_steps: 1000
  gen_prompt: "The history of artificial intelligence began"
  gen_max_new_tokens: 64

quant:
  scale_mode: rtn
  include_lm_head: false

# Short QAT-from-pretrained (R3')
qat_steps: 500
qat_lr: 1.0e-5

paths:
  root: .
  hf_cache: hf_cache
  data_dir: data
  init_model: checkpoints/init_model
  ckpt_bf16: checkpoints/ckpt_bf16
  ckpt_bf16_mxfp4_ptq: checkpoints/ckpt_bf16_mxfp4_ptq
  ckpt_mxfp4: checkpoints/ckpt_mxfp4
  results: results/main_360m
