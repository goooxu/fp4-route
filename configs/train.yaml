# Default alias → smoke; prefer main_360m / smoke_135m explicitly
seed: 42

arch_model_id: HuggingFaceTB/SmolLM2-360M
tokenizer_id: HuggingFaceTB/SmolLM2-360M

data:
  train_dataset: HuggingFaceFW/fineweb-edu
  train_dataset_config: sample-10BT
  text_column: text
  eval_dataset: Salesforce/wikitext
  eval_dataset_config: wikitext-2-raw-v1
  seq_len: 512

train:
  target_tokens: 100000000
  max_steps: 10000
  batch_size: 16
  grad_accum: 1
  lr: 3.0e-4
  min_lr: 3.0e-5
  warmup_steps: 100
  weight_decay: 0.1
  max_grad_norm: 1.0
  log_every: 20
  save_every: 200
  resume: true
  bf16: true
  allow_tf32: true

eval:
  stride: 256
  val_tokens: 100000
  val_every_steps: 200

paths:
  root: .
  hf_cache: hf_cache
  data_dir: data
  init_model: checkpoints/init_model
  ckpt_bf16: checkpoints/ckpt_bf16
  ckpt_nvfp4: checkpoints/ckpt_nvfp4
  results: results
