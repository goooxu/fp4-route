# Smoke: SmolLM2-135M arch, FineWeb ~200M tokens
seed: 42
isolate_seed_paths: true

arch_model_id: HuggingFaceTB/SmolLM2-135M
tokenizer_id: HuggingFaceTB/SmolLM2-135M

data:
  train_dataset: HuggingFaceFW/fineweb-edu
  train_dataset_config: sample-10BT
  text_column: text
  eval_dataset: Salesforce/wikitext
  eval_dataset_config: wikitext-2-raw-v1
  seq_len: 512
  prefetch_fineweb: true
  stream_shuffle_buffer: 10000
  tokenize_flush_docs: 256

train:
  target_tokens: 200000000
  max_steps: 50000
  batch_size: 32
  grad_accum: 1
  lr: 3.0e-4
  min_lr: 3.0e-5
  warmup_steps: 200
  weight_decay: 0.1
  max_grad_norm: 1.0
  log_every: 20
  save_every: 200
  resume: true
  bf16: true
  num_workers: 2
  pin_memory: true
  allow_tf32: true
  cudnn_benchmark: true

eval:
  stride: 256
  val_tokens: 200000
  val_every_steps: 200
  gen_prompt: "The history of artificial intelligence began"
  gen_max_new_tokens: 64

paths:
  root: .
  hf_cache: hf_cache
  data_dir: data
  init_model: checkpoints/init_model
  ckpt_bf16: checkpoints/ckpt_bf16
  ckpt_nvfp4: checkpoints/ckpt_nvfp4
  results: results/smoke_135m
