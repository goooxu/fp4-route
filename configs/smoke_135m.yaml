# Smoke: SmolLM2-135M arch, FineWeb-Edu ~200M tokens, WikiText-2 eval
seed: 42
isolate_seed_paths: false

arch_model_id: HuggingFaceTB/SmolLM2-135M
tokenizer_id: HuggingFaceTB/SmolLM2-135M

data:
  train_dataset: HuggingFaceFW/fineweb-edu
  train_dataset_config: sample-10BT
  text_column: text
  eval_dataset: Salesforce/wikitext
  eval_dataset_config: wikitext-2-raw-v1
  seq_len: 512
  prefetch_fineweb: true
  stream_shuffle_buffer: 10000
  tokenize_flush_docs: 256

train:
  target_tokens: 200000000   # ~200M smoke
  max_steps: 100000          # fallback if target_tokens unused
  batch_size: 8
  grad_accum: 4
  lr: 3.0e-4
  min_lr: 3.0e-5
  warmup_steps: 200
  weight_decay: 0.1
  max_grad_norm: 1.0
  log_every: 50
  save_every: 500            # mid-run resume checkpoints
  resume: true
  bf16: true
  num_workers: 2

eval:
  stride: 256
  max_eval_tokens: null
  val_tokens: 1000000        # 1M FineWeb val
  val_every_steps: 200
  gen_prompt: "The history of artificial intelligence began"
  gen_max_new_tokens: 64

quant:
  scale_mode: rtn
  include_lm_head: false

paths:
  root: .
  hf_cache: hf_cache
  data_dir: data
  init_model: checkpoints/init_model
  ckpt_bf16: checkpoints/ckpt_bf16
  ckpt_bf16_mxfp4_ptq: checkpoints/ckpt_bf16_mxfp4_ptq
  ckpt_mxfp4: checkpoints/ckpt_mxfp4
  results: results/smoke_135m
