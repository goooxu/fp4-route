<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1180" viewBox="0 0 980 1180">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="490" y="28" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#111827">SmolLM2-360M 完整结构（LlamaForCausalLM）</text>
  <text x="490" y="50" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#6b7280">架构来源 HuggingFaceTB/SmolLM2-360M · from_config 随机初始化 · ~362M 参数</text>

  <!-- ========== LEFT: overall stack ========== -->
  <text x="200" y="82" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="600" fill="#1e40af">整体数据流</text>

  <!-- tokens in -->
  <rect x="70" y="95" width="260" height="36" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="200" y="118" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#111827">input_ids  [B, S]  S≤512（训练）</text>

  <path d="M200 131 L200 145" stroke="#6b7280" stroke-width="1.5"/>

  <!-- embed -->
  <rect x="70" y="145" width="260" height="50" rx="8" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="200" y="168" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="600" fill="#111827">embed_tokens</text>
  <text x="200" y="186" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" fill="#4b5563">vocab 49152 → hidden 960 · 高精</text>

  <path d="M200 195 L200 210" stroke="#6b7280" stroke-width="1.5"/>

  <!-- blocks stack -->
  <rect x="55" y="210" width="290" height="200" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="200" y="232" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="600" fill="#047857">Decoder Layers × 32</text>
  <text x="200" y="252" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" fill="#065f46">num_hidden_layers = 32</text>

  <rect x="80" y="265" width="240" height="36" rx="6" fill="#d1fae5" stroke="#059669"/>
  <text x="200" y="288" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#064e3b">Layer 0 · Transformer Block</text>
  <rect x="80" y="308" width="240" height="36" rx="6" fill="#a7f3d0" stroke="#059669"/>
  <text x="200" y="331" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#064e3b">Layer 1 … Layer 30（同构）</text>
  <rect x="80" y="351" width="240" height="36" rx="6" fill="#d1fae5" stroke="#059669"/>
  <text x="200" y="374" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#064e3b">Layer 31 · Transformer Block</text>

  <path d="M200 410 L200 430" stroke="#6b7280" stroke-width="1.5"/>

  <!-- final norm -->
  <rect x="70" y="430" width="260" height="44" rx="8" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="200" y="450" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="600" fill="#111827">model.norm（RMSNorm）</text>
  <text x="200" y="467" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" fill="#4b5563">eps=1e-5 · 高精</text>

  <path d="M200 474 L200 490" stroke="#6b7280" stroke-width="1.5"/>

  <!-- lm_head -->
  <rect x="70" y="490" width="260" height="50" rx="8" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="200" y="512" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="600" fill="#111827">lm_head</text>
  <text x="200" y="530" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" fill="#4b5563">960 → 49152 · 与 embed 权重绑定 · 高精</text>

  <path d="M200 540 L200 555" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="70" y="555" width="260" height="36" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="200" y="578" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#92400e">logits [B, S, 49152]</text>

  <!-- dims box -->
  <rect x="55" y="610" width="290" height="130" rx="8" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="200" y="632" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827">关键维度</text>
  <text x="75" y="655" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" fill="#374151">hidden_size h = 960</text>
  <text x="75" y="673" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" fill="#374151">intermediate_size = 2560</text>
  <text x="75" y="691" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" fill="#374151">n_head = 15 · n_kv = 5 · head_dim = 64</text>
  <text x="75" y="709" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" fill="#374151">15×64 = 960 · GQA（KV 共享）</text>
  <text x="75" y="727" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" fill="#374151">max_position = 8192 · RoPE θ = 1e5</text>

  <!-- ========== RIGHT: one block detail ========== -->
  <text x="680" y="82" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="600" fill="#047857">单个 Transformer Block 展开</text>
  <rect x="380" y="95" width="560" height="640" rx="12" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>

  <!-- residual in -->
  <text x="660" y="120" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#065f46">x ∈ R^{B×S×960}</text>

  <!-- attn branch -->
  <rect x="400" y="135" width="250" height="300" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="525" y="155" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="600" fill="#1d4ed8">Self-Attention</text>

  <rect x="415" y="168" width="220" height="28" rx="4" fill="#e5e7eb" stroke="#6b7280"/>
  <text x="525" y="187" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" fill="#111827">input_layernorm (RMSNorm)</text>

  <rect x="415" y="205" width="100" height="32" rx="4" fill="#10b981"/>
  <text x="465" y="225" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" fill="#fff">q_proj</text>
  <rect x="525" y="205" width="50" height="32" rx="4" fill="#10b981"/>
  <text x="550" y="225" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" fill="#fff">k</text>
  <rect x="585" y="205" width="50" height="32" rx="4" fill="#10b981"/>
  <text x="610" y="225" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" fill="#fff">v</text>

  <text x="525" y="255" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#374151">Linear · 可 TE NVFP4 · bias=false</text>
  <text x="525" y="270" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#374151">Q: 960→960 · K/V: 960→320 (5×64)</text>

  <rect x="415" y="280" width="220" height="48" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="525" y="300" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" fill="#1e3a8a">RoPE(Q), RoPE(K)</text>
  <text x="525" y="316" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#1e40af">GQA Attention · Softmax · 高精</text>

  <rect x="415" y="340" width="220" height="32" rx="4" fill="#10b981"/>
  <text x="525" y="360" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" fill="#fff">o_proj  960→960 Linear</text>

  <text x="525" y="395" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" fill="#047857">+ 残差连接  x ← x + attn</text>

  <!-- mlp branch -->
  <rect x="670" y="135" width="250" height="300" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="795" y="155" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="600" fill="#b45309">MLP（SwiGLU 风格）</text>

  <rect x="685" y="168" width="220" height="28" rx="4" fill="#e5e7eb" stroke="#6b7280"/>
  <text x="795" y="187" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" fill="#111827">post_attention_layernorm</text>

  <rect x="685" y="210" width="100" height="36" rx="4" fill="#10b981"/>
  <text x="735" y="232" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" fill="#fff">gate_proj</text>
  <rect x="800" y="210" width="100" height="36" rx="4" fill="#10b981"/>
  <text x="850" y="232" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" fill="#fff">up_proj</text>

  <text x="795" y="265" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#374151">960 → 2560 · Linear · bias=false</text>

  <rect x="685" y="280" width="220" height="36" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="795" y="302" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" fill="#78350f">SiLU(gate) ⊙ up</text>

  <rect x="685" y="330" width="220" height="32" rx="4" fill="#10b981"/>
  <text x="795" y="350" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" fill="#fff">down_proj  2560→960</text>

  <text x="795" y="395" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" fill="#047857">+ 残差  x ← x + mlp</text>

  <!-- arrows between attn and mlp order -->
  <text x="660" y="455" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#374151">执行顺序：Pre-Norm Attention → 残差 → Pre-Norm MLP → 残差</text>

  <!-- GQA detail -->
  <rect x="400" y="475" width="520" height="95" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="660" y="498" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" fill="#1e40af">GQA（Grouped Query Attention）示意</text>
  <text x="420" y="522" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" fill="#1e3a8a">• 15 个 Q head；仅 5 组 K/V head（每组服务 3 个 Q head）</text>
  <text x="420" y="540" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" fill="#1e3a8a">• 降低 KV 显存与带宽，质量接近 MHA</text>
  <text x="420" y="558" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" fill="#1e3a8a">• attention_bias = false · attention_dropout = 0</text>

  <!-- legend -->
  <rect x="400" y="585" width="520" height="130" rx="8" fill="#ffffff" stroke="#9ca3af"/>
  <text x="660" y="608" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827">本实验精度图例（R2/R3）</text>
  <rect x="420" y="625" width="18" height="14" rx="2" fill="#10b981"/>
  <text x="448" y="636" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" fill="#111827">绿色 Linear：替换为 te.Linear，GEMM 可走 NVFP4</text>
  <rect x="420" y="650" width="18" height="14" rx="2" fill="#e5e7eb" stroke="#6b7280"/>
  <text x="448" y="661" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" fill="#111827">灰色：Embedding / RMSNorm / lm_head — 保持高精</text>
  <rect x="420" y="675" width="18" height="14" rx="2" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="448" y="686" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" fill="#111827">蓝色：RoPE / Softmax / 残差 — 高精数值路径</text>
  <text x="420" y="705" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" fill="#374151">每层 Linear 数：q,k,v,o + gate,up,down = 7 · ×32 层 ≈ 224（与 TE 替换计数一致）</text>

  <!-- bottom formula strip -->
  <rect x="55" y="760" width="885" height="200" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="497" y="788" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="600" fill="#111827">单层数学结构（Llama 风格 Pre-Norm）</text>
  <text x="80" y="820" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#111827">h₁ = x + SelfAttn( RMSNorm(x) )</text>
  <text x="80" y="848" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#111827">y  = h₁ + MLP( RMSNorm(h₁) )</text>
  <text x="80" y="876" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#111827">MLP(z) = down( SiLU(gate(z)) ⊙ up(z) )     其中 gate/up/down 为无 bias 的 Linear</text>
  <text x="80" y="904" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#111827">SelfAttn：Q=q_proj(z)，K=k_proj(z)，V=v_proj(z) → RoPE → GQA-SDPA → o_proj</text>
  <text x="80" y="932" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#6b7280">tie_word_embeddings=true：lm_head.weight 与 embed_tokens.weight 共享同一参数矩阵</text>

  <!-- foot -->
  <text x="490" y="1000" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" fill="#9ca3af">图 fig08 · 依据 checkpoints/.../config.json 与 Llama 实现绘制 · SVG</text>
  <text x="490" y="1020" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" fill="#9ca3af">训练序列长 seq_len=512；位置编码支持至 8192</text>

  <!-- dashed connector from left stack to right -->
  <path d="M345 310 L380 310" stroke="#059669" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="380,310 370,305 370,315" fill="#059669"/>
  <text x="360" y="300" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#047857">展开</text>
</svg>
