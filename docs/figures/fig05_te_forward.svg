<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="440" y="28" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="600" fill="#111827">TE NVFP4 在 Linear 上如何工作（概念）</text>
  <text x="440" y="50" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#6b7280">参数仍以较高精度保存；进入 GEMM 时按块缩放为 NVFP4，由 Tensor Core 计算</text>

  <!-- left: params -->
  <rect x="40" y="90" width="200" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="125" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="600" fill="#1e40af">te.Linear 参数</text>
  <text x="140" y="150" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#1e3a8a">weight / bias ≈ BF16</text>
  <text x="140" y="170" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#1e3a8a">可训练、可存盘</text>

  <!-- arrow -->
  <path d="M240 140 L300 140" stroke="#6b7280" stroke-width="2"/>
  <polygon points="300,140 290,134 290,146" fill="#6b7280"/>

  <!-- middle: autocast -->
  <rect x="300" y="70" width="280" height="140" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="440" y="100" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="600" fill="#047857">te.autocast(NVFP4BlockScaling)</text>
  <text x="440" y="128" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#065f46">1. 按 block 估计 scale</text>
  <text x="440" y="148" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#065f46">2. 激活/权重 → NVFP4</text>
  <text x="440" y="168" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#065f46">3. Tensor Core GEMM</text>
  <text x="440" y="188" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#065f46">4. 结果回到高精激活</text>

  <path d="M580 140 L640 140" stroke="#6b7280" stroke-width="2"/>
  <polygon points="640,140 630,134 630,146" fill="#6b7280"/>

  <!-- right: output -->
  <rect x="640" y="90" width="200" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="740" y="130" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="600" fill="#92400e">输出激活</text>
  <text x="740" y="155" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#78350f">BF16 / 高精</text>
  <text x="740" y="175" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#78350f">供下一层使用</text>

  <!-- training branch -->
  <rect x="120" y="250" width="640" height="130" rx="12" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="440" y="280" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="600" fill="#111827">训练时（R3）还要走反向</text>
  <text x="440" y="310" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#374151">损失 → 反向传播 → 低精度/混合精度梯度 GEMM → AdamW 更新（优化器状态仍偏高精）</text>
  <text x="440" y="340" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#374151">保存 checkpoint 时：revert_te_to_linear → 标准 HF nn.Linear + safetensors</text>
  <text x="440" y="365" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#6b7280">R2 不做反向：仅在推理时对 BF16 权重套同一套 TE 前向路径</text>
</svg>
