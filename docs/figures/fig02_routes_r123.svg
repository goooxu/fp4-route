<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="430" y="30" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="600" fill="#111827">三条对比路线 R1 / R2 / R3</text>
  <text x="430" y="52" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#6b7280">同一架构、同一数据预算；R2 不另训，复用 R1 的 BF16 权重</text>

  <!-- shared init -->
  <rect x="320" y="70" width="220" height="44" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="430" y="97" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#111827">随机初始化 init_model</text>
  <line x1="430" y1="114" x2="430" y2="140" stroke="#6b7280" stroke-width="2"/>
  <polygon points="430,148 424,136 436,136" fill="#6b7280"/>

  <!-- R1 column -->
  <rect x="40" y="160" width="240" height="280" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="188" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">R1 基准</text>
  <rect x="60" y="210" width="200" height="40" rx="6" fill="#2563eb"/>
  <text x="160" y="235" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#fff">训练：BF16</text>
  <line x1="160" y1="250" x2="160" y2="270" stroke="#2563eb" stroke-width="2"/>
  <rect x="60" y="270" width="200" height="40" rx="6" fill="#3b82f6"/>
  <text x="160" y="295" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#fff">权重：ckpt_bf16</text>
  <line x1="160" y1="310" x2="160" y2="330" stroke="#2563eb" stroke-width="2"/>
  <rect x="60" y="330" width="200" height="40" rx="6" fill="#60a5fa"/>
  <text x="160" y="355" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#1e3a8a">推理：BF16</text>
  <text x="160" y="410" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#374151">质量 + 吞吐基准</text>

  <!-- R2 column -->
  <rect x="310" y="160" width="240" height="280" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="430" y="188" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#b45309">R2 推理量化</text>
  <rect x="330" y="210" width="200" height="40" rx="6" fill="#d97706"/>
  <text x="430" y="235" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#fff">训练：不另训（=R1）</text>
  <line x1="430" y1="250" x2="430" y2="270" stroke="#d97706" stroke-width="2"/>
  <rect x="330" y="270" width="200" height="40" rx="6" fill="#f59e0b"/>
  <text x="430" y="295" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#fff">权重：ckpt_bf16</text>
  <line x1="430" y1="310" x2="430" y2="330" stroke="#d97706" stroke-width="2"/>
  <rect x="330" y="330" width="200" height="40" rx="6" fill="#fbbf24"/>
  <text x="430" y="355" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#78350f">推理：TE NVFP4</text>
  <text x="430" y="410" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#374151">只改推理精度</text>

  <!-- R3 column -->
  <rect x="580" y="160" width="240" height="280" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="700" y="188" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#047857">R3 低精度训练</text>
  <rect x="600" y="210" width="200" height="40" rx="6" fill="#059669"/>
  <text x="700" y="235" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#fff">训练：TE NVFP4</text>
  <line x1="700" y1="250" x2="700" y2="270" stroke="#059669" stroke-width="2"/>
  <rect x="600" y="270" width="200" height="40" rx="6" fill="#10b981"/>
  <text x="700" y="295" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#fff">权重：ckpt_nvfp4</text>
  <line x1="700" y1="310" x2="700" y2="330" stroke="#059669" stroke-width="2"/>
  <rect x="600" y="330" width="200" height="40" rx="6" fill="#34d399"/>
  <text x="700" y="355" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#064e3b">推理：TE NVFP4</text>
  <text x="700" y="410" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#374151">训练+推理一致低精度</text>

  <!-- arrow from init to R3 train branch note -->
  <path d="M430 148 L160 160" stroke="#9ca3af" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
  <path d="M430 148 L700 160" stroke="#9ca3af" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
</svg>
